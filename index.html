<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Gracy ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,#7b2b72 0%,transparent 35%),
    radial-gradient(circle at 80% 90%,#4b1d68 0%,transparent 35%),
    linear-gradient(135deg,#090713,#170d25,#090713);
  overflow-x:hidden;
}

.container{
  width:92%;
  max-width:650px;
  margin:auto;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:35px 0;
  position:relative;
  z-index:2;
}

.card{
  width:100%;
  padding:32px 22px;
  border-radius:30px;
  background:rgba(255,255,255,.075);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 70px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);
}

.top{
  font-size:12px;
  letter-spacing:4px;
  opacity:.65;
  text-transform:uppercase;
}

h1{
  font-size:clamp(48px,14vw,82px);
  margin:12px 0 4px;
  background:linear-gradient(90deg,#fff,#ffb4df,#d9b8ff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  font-size:15px;
  line-height:1.6;
  opacity:.78;
  max-width:450px;
  margin:0 auto 25px;
}

.date{
  font-size:21px;
  font-weight:bold;
  margin-bottom:22px;
}

.countdown{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  margin-bottom:22px;
}

.time-box{
  width:75px;
  padding:13px 4px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
}

.number{
  font-size:27px;
  font-weight:bold;
}

.label{
  margin-top:4px;
  font-size:9px;
  letter-spacing:1px;
  opacity:.55;
}

.locked{
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.1);
  line-height:1.6;
  font-size:14px;
}

.open-area{
  display:none;
}

.open-button{
  border:0;
  color:white;
  font-size:16px;
  font-weight:bold;
  padding:16px 28px;
  border-radius:50px;
  background:linear-gradient(90deg,#ff4d9d,#9b5cff);
  box-shadow:0 10px 30px rgba(255,77,157,.3);
  cursor:pointer;
}

.open-button:active{
  transform:scale(.96);
}

.message{
  display:none;
  margin-top:25px;
  text-align:left;
  padding:25px 21px;
  border-radius:25px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  line-height:1.8;
  animation:showMessage .8s ease;
}

.message h2{
  text-align:center;
 
</body>
</html>
